# The Hill Station — clean URLs for nginx
# Add these directives inside the server { } block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Expected public URLs:
#   /  /about  /rooms  /contact  /dining  /gallery  /leisure
#   /meetings-events  /facilities  /experiences  /estate-experiences
#   /gym  /laundry-cafe  /restaurant  /suites  /deluxe  /standard
#   /privacy  /terms  /room-list  /coming-soon  /launch-offer

# 301: /index.html → /
location = /index.html {
    return 301 /;
}

# 301: old HTML filenames → clean slugs
location = /about_us_the_hill_station_jos.html { return 301 /about; }
location = /booking_the_hill_station_jos.html { return 301 /rooms; }
location = /room_list.html { return 301 /room-list; }
location = /contact_the_hill_station_jos_master_update.html { return 301 /contact; }
location = /dining_the_hill_station_jos.html { return 301 /dining; }
location = /gallery_the_hill_station_jos.html { return 301 /gallery; }
location = /leisure.html { return 301 /leisure; }
location = /meetings_events_the_hill_station_jos.html { return 301 /meetings-events; }
location = /facilities_the_hill_station_jos_master_update.html { return 301 /facilities; }
location = /estate_experiences_the_hill_station_jos.html { return 301 /estate-experiences; }
location = /experiences_the_hill_station_jos.html { return 301 /experiences; }
location = /gym_the_hill_station_jos.html { return 301 /gym; }
location = /laundry_cafe_the_hill_station_jos.html { return 301 /laundry-cafe; }
location = /restaurant_the_hill_station_jos.html { return 301 /restaurant; }
location = /room_details_hillstation_suit.html { return 301 /suites; }
location = /room_details_hillstation_delux.html { return 301 /deluxe; }
location = /room_details_skylark_standard.html { return 301 /standard; }
location = /privacy_policy.html { return 301 /privacy; }
location = /terms_of_service.html { return 301 /terms; }

# 301: any other /page.html → /page
location ~ ^/([^/]+)\.html$ {
    return 301 /$1;
}

# Serve clean slugs
rewrite ^/about/?$ /about_us_the_hill_station_jos.html last;
rewrite ^/rooms/?$ /booking_the_hill_station_jos.html last;
rewrite ^/room-list/?$ /room_list.html last;
rewrite ^/contact/?$ /contact_the_hill_station_jos_master_update.html last;
rewrite ^/dining/?$ /dining_the_hill_station_jos.html last;
rewrite ^/gallery/?$ /gallery_the_hill_station_jos.html last;
rewrite ^/leisure/?$ /leisure.html last;
rewrite ^/meetings-events/?$ /meetings_events_the_hill_station_jos.html last;
rewrite ^/facilities/?$ /facilities_the_hill_station_jos_master_update.html last;
rewrite ^/estate-experiences/?$ /estate_experiences_the_hill_station_jos.html last;
rewrite ^/experiences/?$ /experiences_the_hill_station_jos.html last;
rewrite ^/gym/?$ /gym_the_hill_station_jos.html last;
rewrite ^/laundry-cafe/?$ /laundry_cafe_the_hill_station_jos.html last;
rewrite ^/restaurant/?$ /restaurant_the_hill_station_jos.html last;
rewrite ^/suites/?$ /room_details_hillstation_suit.html last;
rewrite ^/deluxe/?$ /room_details_hillstation_delux.html last;
rewrite ^/standard/?$ /room_details_skylark_standard.html last;
rewrite ^/privacy/?$ /privacy_policy.html last;
rewrite ^/terms/?$ /terms_of_service.html last;
rewrite ^/launch-offer/?$ /launch_signup.html last;
rewrite ^/coming-soon/?$ /coming-soon/index.html last;

location ^~ /js/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000";
}

location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
}
